[project]
name = "localshare"
version = "1.0.0"
description = "A modern, cross-platform desktop application for local file sharing."
readme = "README.md"
authors = [
    { name = "Ahmed Samy", email = "ahmedthebest31@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.2",
    "packaging>=25.0",
    "pillow>=12.1.0",
    "pyside6>=6.10.1",
    "qrcode>=8.2",
    "requests>=2.32.5",
]

[project.scripts]
localshare = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "server_handler", "update_manager"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest>=9.1.1",
]
