name: Production Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Dependencies
        run: uv sync

      - name: Build Windows Executable
        run: uv run pyinstaller --noconfirm localShare.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup Installer (Inno Setup)
        run: iscc localShare_build.iss

      - name: Assemble Windows Portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Portable"
          Copy-Item -Path "dist\localShare.exe" -Destination "Portable\"
          Compress-Archive -Path "Portable\*" -DestinationPath "localShare-win-x64-Portable.zip" -Force

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $setupHash = (Get-FileHash output\localShare_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$setupHash  localShare_Setup.exe" | Out-File checksums-windows.txt -Encoding ascii
          $portHash = (Get-FileHash localShare-win-x64-Portable.zip -Algorithm SHA256).Hash.ToLower()
          "$portHash  localShare-win-x64-Portable.zip" | Out-File checksums-windows.txt -Encoding ascii -Append

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/localShare_Setup.exe
            localShare-win-x64-Portable.zip
            checksums-windows.txt

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install X11 Dummy (For PySide6 Headless Build)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Sync Dependencies
        run: uv sync

      - name: Build Linux Executable
        run: xvfb-run uv run pyinstaller --noconfirm localShare.spec

      - name: Assemble Linux Portable
        shell: bash
        run: |
          mkdir -p Portable
          cp dist/localShare Portable/
          cd Portable
          zip -r ../localShare-linux-x64.zip .

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          sha256sum localShare-linux-x64.zip > checksums-linux.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            localShare-linux-x64.zip
            checksums-linux.txt

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Dependencies
        run: uv sync

      - name: Build macOS Executable
        run: uv run pyinstaller --noconfirm localShare.spec

      - name: Assemble macOS Portable
        shell: bash
        run: |
          mkdir -p Portable
          cp dist/localShare Portable/
          cd Portable
          zip -r ../localShare-mac-x64.zip .

      - name: Generate SHA256 Checksum
        shell: bash
        run: |
          shasum -a 256 localShare-mac-x64.zip > checksums-macos.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            localShare-mac-x64.zip
            checksums-macos.txt
